name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Prisma generate (SQLite, dev schema)
        run: npx prisma generate

      - name: Prisma generate (Postgres, prod schema)
        run: npx prisma generate --schema prisma/schema.postgres.prisma

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
