name: mcfinancial

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: mcfinancial
      POSTGRES_USER: mcfinancial
      POSTGRES_PASSWORD: mcfinancial_dev
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcfinancial -d mcfinancial"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_local_data:
