services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: mc_admin
      POSTGRES_USER: mc_admin
      POSTGRES_PASSWORD: mc_admin_dev
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc_admin -d mc_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_local_data:

