services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: mcfinance
      POSTGRES_USER: mcfinance
      POSTGRES_PASSWORD: mcfinance_dev
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcfinance -d mcfinance"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_local_data:
